<section class="projects container" id="projects">
  <div appReveal>
    <p class="section-label">{{ 'projects.label' | translate }}</p>
    <h2 class="section-title">{{ 'projects.title' | translate }}</h2>
    <p class="projects__text">{{ 'projects.text' | translate }}</p>
  </div>

  <div class="projects__showcase" appReveal [delay]="150">
    <ul class="projects__list" (mouseleave)="hover(null)">
      @for (project of projects; track project.id; let index = $index) {
        <li>
          <button
            type="button"
            class="projects__row"
            (mouseenter)="hover(index)"
            (focus)="hover(index)"
            (blur)="hover(null)"
            (click)="open(index)"
          >
            <span class="projects__name">
              {{ project.title }}
              <app-icon class="projects__arrow" name="arrow-up-right" [size]="20" />
            </span>
            <span class="projects__tech">
              @for (tech of project.technologies; track tech.name; let last = $last) {
                {{ tech.name }}
                @if (!last) {
                  <span class="projects__separator">|</span>
                }
              }
            </span>
          </button>
        </li>
      }
    </ul>

    <div
      class="preview"
      [class.preview--visible]="hoveredIndex() !== null"
      [style.top.px]="preview().top"
      aria-hidden="true"
    >
      <span class="stripes"></span>
      <img class="preview__image" [src]="preview().project.image" alt="" width="296" height="192" />
    </div>
  </div>

  <a appReveal class="btn btn--marquee projects__more" [href]="repositoriesUrl" target="_blank" rel="noopener noreferrer">
    <span class="btn__label">{{ 'projects.moreRepos' | translate }}</span>
    <app-icon name="arrow-up-right" [size]="20" />
  </a>
</section>

@if (selected(); as selection) {
  <app-project-dialog
    [project]="selection.project"
    [number]="selection.number"
    (closed)="close()"
    (nextRequested)="next()"
  />
}
