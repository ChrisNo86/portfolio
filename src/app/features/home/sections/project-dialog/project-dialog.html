<div class="backdrop" (click)="close()"></div>

<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="project-dialog-title">
  <div class="dialog__info">
    <p class="dialog__number">{{ number() | number: '2.0-0' }}</p>
    <h2 class="dialog__title" id="project-dialog-title">{{ project().title }}</h2>
    <h3 class="dialog__question">{{ 'projects.dialog.about' | translate }}</h3>
    <p class="dialog__description">{{ project().descriptionKey | translate }}</p>

    <ul class="dialog__tech">
      @for (tech of project().technologies; track tech.name) {
        <li>
          <img [src]="tech.icon" alt="" width="24" height="24" />
          {{ tech.name }}
        </li>
      }
    </ul>

    <div class="dialog__links">
      <a class="btn" [href]="project().githubUrl" target="_blank" rel="noopener noreferrer">
        GitHub <app-icon class="dialog__link-icon" name="arrow-up-right" [size]="20" />
      </a>
      <a class="btn" [href]="project().liveUrl" target="_blank" rel="noopener noreferrer">
        {{ 'projects.dialog.liveTest' | translate }}
        <app-icon class="dialog__link-icon" name="arrow-up-right" [size]="20" />
      </a>
    </div>
  </div>

  <img
    class="dialog__image"
    [src]="project().image"
    [alt]="'projects.dialog.previewAlt' | translate: { title: project().title }"
    width="520"
    height="370"
  />

  <button
    #closeButton
    type="button"
    class="dialog__close"
    [attr.aria-label]="'projects.dialog.close' | translate"
    (click)="close()"
  >
    <app-icon name="close" [size]="48" />
  </button>

  <button type="button" class="dialog__next" (click)="nextRequested.emit()">
    {{ 'projects.dialog.next' | translate }}
    <app-icon class="dialog__next-icon" name="arrow-next" [size]="32" />
  </button>
</div>
